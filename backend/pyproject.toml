[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "composer-studio"
version = "0.1.0"
description = "Local AI music studio application skeleton"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.1",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
]

[project.scripts]
studio-worker = "studio.worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]
